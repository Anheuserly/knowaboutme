<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17" />
      <stop offset="50%" stop-color="#181329" />
      <stop offset="100%" stop-color="#090714" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- K Stem Gradient -->
    <linearGradient id="kStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- K Arms Gradient -->
    <linearGradient id="kArmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Star Glow -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Reflection inside top edge -->
  <path d="M 28 8 Q 64 16 100 8" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Central Identity Iris / Radial Rings -->
  <circle cx="64" cy="65" r="30" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="64" cy="65" r="22" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="64" cy="65" r="14" fill="#0f0f17" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2" />
  <circle cx="64" cy="65" r="6" fill="#38bdf8" />

  <!-- Left Stem of 'K' -->
  <path
    d="M 32 34 
       C 32 30.5, 34.5 28, 38 28
       L 44 28
       C 47.5 28, 50 30.5, 50 34
       L 50 94
       C 50 97.5, 47.5 100, 44 100
       L 38 100
       C 34.5 100, 32 97.5, 32 94
       Z"
    fill="url(#kStemGrad)"
  />
  <!-- Inner Highlight line on K Stem -->
  <line x1="41" y1="33" x2="41" y2="95" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />

  <!-- Upper Diagonal Arm of 'K' -->
  <path
    d="M 52 62
       L 76 34
       C 78 31.5, 82 31.5, 84 34
       L 91 41
       C 93 43, 93 47, 90 49
       L 68 72
       Z"
    fill="url(#kArmGrad)"
  />

  <!-- Lower Diagonal Arm of 'K' -->
  <path
    d="M 54 62
       L 72 50
       L 91 83
       C 93 86.5, 92 90, 88.5 92
       L 80 96
       C 77 97.5, 73.5 96.5, 71.5 93
       Z"
    fill="url(#kArmGrad)"
  />

  <!-- The Beacon Star (Identity Star at the top of the central iris) -->
  <g filter="url(#beaconGlow)">
    <path
      d="M 64 20 
         Q 64 28 72 28 
         Q 64 28 64 36 
         Q 64 28 56 28 
         Q 64 28 64 20 Z"
      fill="#ffffff"
    />
    <circle cx="64" cy="28" r="2" fill="#38bdf8" />
  </g>
</svg>
